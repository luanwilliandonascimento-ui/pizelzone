<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Notebooks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">NOTEBOOKS</h2>
        
        <div class="grade-produtos">
            <div class="cartao-produto">
                <img src="note1.png" alt="Note 1" class="foto-produto">
                <p>Notebook Gamer 16GB</p>
                <p class="preco">R$ 4.899</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Gamer 16GB', 'R$ 4.899', 'note1.png')">COMPRAR</a>
            </div>
            <div class="cartao-produto">
                <img src="note2.png" alt="Note 2" class="foto-produto">
                <p>Notebook Ultrafino 16GB</p>
                <p class="preco">R$ 3.999</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Ultrafino 16GB', 'R$ 3.999', 'note2.png')">COMPRAR</a>
            </div>
            <div class="cartao-produto">
                <img src="note3.png" alt="Note 3" class="foto-produto">
                <p>Notebook Gamer RTX</p>
                <p class="preco">R$ 4.899</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Gamer RTX', 'R$ 4.899', 'note3.png')">COMPRAR</a>
            </div>
            <div class="cartao-produto">
                <img src="note4.png" alt="Note 4" class="foto-produto">
                <p>Notebook Ultrafino i7</p>
                <p class="preco">R$ 3.999</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Ultrafino i7', 'R$ 3.999', 'note4.png')">COMPRAR</a>
            </div>
            <div class="cartao-produto">
                <img src="note5.png" alt="Note 5" class="foto-produto">
                <p>Notebook Studio 32GB</p>
                <p class="preco">R$ 6.599</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Studio 32GB', 'R$ 6.599', 'note5.png')">COMPRAR</a>
            </div>
            <div class="cartao-produto">
                <img src="note6.png" alt="Note 6" class="foto-produto">
                <p>Notebook Básic i5</p>
                <p class="preco">R$ 2.999</p>
                <a href="resumo.html" class="botao-comprar" onclick="guardarProduto('Notebook Básic i5', 'R$ 2.999', 'note6.png')">COMPRAR</a>
            </div>
        </div>
    </div>
    <script src="resumo.js"></script>
</body>
</html>
