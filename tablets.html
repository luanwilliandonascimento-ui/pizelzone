<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Tablets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">TABLETS</h2>
        
        <div class="grade-produtos">
            <div class="cartao-produto">
                <img src="./img/tablet 1.jpg" alt="Tablet 1" class="foto-produto">
                <p>iPad Pro 13" M4 512GB</p>
                <p class="preco">R$ 12.499,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('iPad Pro 13 M4 512GB', 'R$ 12.499,90', './img/tablet 1.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/tablet 2.jpg" alt="Tablet 2" class="foto-produto">
                <p>Samsung Galaxy Tab S10 Ultra 512GB</p>
                <p class="preco">R$ 8.499,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Samsung Galaxy Tab S10 Ultra 512GB', 'R$ 8.499,90', './img/tablet 2.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/tablet 3.jpg" alt="Tablet 3" class="foto-produto">
                <p>iPad Air 11" M2 256GB</p>
                <p class="preco">R$ 6.299,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('iPad Air 11 M2 256GB', 'R$ 6.299,90', './img/tablet 3.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/tablet 4.jpg" alt="Tablet 4" class="foto-produto">
                <p>Samsung Galaxy Tab S9 FE 128GB</p>
                <p class="preco">R$ 2.799,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Samsung Galaxy Tab S9 FE 128GB', 'R$ 2.799,90', './img/tablet 4.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/tablet 5.jpg" alt="Tablet 5" class="foto-produto">
                <p>Xiaomi Pad 6 256GB</p>
                <p class="preco">R$ 2.199,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Xiaomi Pad 6 256GB', 'R$ 2.199,90', './img/tablet 5.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/tablet 6.jpg" alt="Tablet 6" class="foto-produto">
                <p>Lenovo Tab P12 128GB</p>
                <p class="preco">R$ 1.899,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Lenovo Tab P12 128GB', 'R$ 1.899,90', './img/tablet 6.jpg')">COMPRAR</button>
            </div>
        </div>
    </div>
    <script src="resumo.js"></script>
</body>
</html>
