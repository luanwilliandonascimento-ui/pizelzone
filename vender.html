<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Vender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">VENDER SEU DISPOSITIVO</h2>
        <form action="proposta.html">
            <input type="text" placeholder="TIPO DO DISPOSITIVO" class="campo" required>
            <input type="text" placeholder="MARCA E MODELO" class="campo" required>
            <input type="text" placeholder="ESTADO DO APARELHO" class="campo" required>
            <input type="text" placeholder="VALOR DESEJADO" class="campo" required>
            <button type="submit" class="botao botao-roxo">ENVIAR PROPOSTA</button>
        </form>
    </div>
</body>
</html>
