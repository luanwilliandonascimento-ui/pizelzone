<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Suporte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">SUPORTE TÉCNICO</h2>
        <form action="solicitação.html">
            <input type="text" placeholder="DISPOSITIVO" class="campo" required>
            <input type="text" placeholder="MARCA E MODELO" class="campo" required>
            <textarea placeholder="DESCRIÇÃO DO PROBLEMA" class="campo" required></textarea>
            <button type="submit" class="botao">SOLICITAR ORÇAMENTO</button>
        </form>
    </div>
</body>
</html>
