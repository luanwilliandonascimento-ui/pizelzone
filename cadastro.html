<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">CADASTRO</h2>
        <form action="sucessocadastro.html">
            <input type="text" placeholder="NOME COMPLETO" class="campo" required>
            <input type="email" placeholder="E-MAIL" class="campo" required>
            <input type="password" placeholder="SENHA" class="campo" required>
            <input type="password" placeholder="CONFIRMAR SENHA" class="campo" required>
            <button type="submit" class="botao botao-roxo">CADASTRAR</button>
        </form>
    </div>
</body>
</html>
