<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Compra Realizada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal" style="text-align: center;">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo" style="color: #28a745;">COMPRA REALIZADA COM SUCESSO!</h2>
        
        <p style="margin-bottom: 20px;">Obrigado por comprar na PixelZone!</p>
        
        <div class="item-carrinho" style="flex-direction: column; align-items: center; justify-content: center; border: none;">
            <img id="foto-sucesso" src="" alt="Produto" style="max-width: 150px; border-radius: 10px; margin-bottom: 15px;">
            <p><strong id="nome-sucesso"></strong></p>
            <p id="total-sucesso" class="preco" style="font-size: 1.2rem; margin-top: 5px;"></p>
        </div>

        <p style="margin: 20px 0;">Seu pedido está sendo processado e chegará em breve no endereço cadastrado.</p>
        
        <a href="index.html" class="botao">VOLTAR AO INÍCIO</a>
    </div>
    <script src="resumo.js"></script>
</body>
</html>
