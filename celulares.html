<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Celulares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-principal">
        <img src="./img/logo.png" alt="PixelZone Logo" class="logo">
        <h2 class="subtitulo">CELULARES</h2>
        
        <div class="grade-produtos">
            <div class="cartao-produto">
                <img src="./img/celular 1.avif" alt="Celular 1" class="foto-produto">
                <p>iphone 18 Pro Max 512GB</p>
                <p class="preco">R$ 14.999,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('iphone 18 Pro Max 512GB', 'R$ 14.999,90', './img/celular 1.avif')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/celular 2.jpg" alt="Celular 2" class="foto-produto">
                <p>Sansung Galaxy S26 Ultra 512Gb</p>
                <p class="preco">R$ 8.999,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Sansung Galaxy S26 Ultra 512Gb', 'R$ 8.999,90', './img/celular 2.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/celular 3.webp" alt="Celular 3" class="foto-produto">
                <p>Xiaomi 17 pro max 1TB</p>
                <p class="preco">R$ 13.999,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Xiaomi 17 pro max 1TB', 'R$ 13.999,90', './img/celular 3.webp')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/celular 4.webp" alt="Celular 4" class="foto-produto">
                <p>Sansung Galaxy S25 FE 512GB</p>
                <p class="preco">R$ 4.999,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Sansung Galaxy S25 FE 512GB', 'R$ 4.999,90', './img/celular 4.webp')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/celular 5.jpg" alt="Celular 5" class="foto-produto">
                <p>Motorola Edge 70 512GB</p>
                <p class="preco">R$ 4.299,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Motorola Edge 70 512GB', 'R$ 4.299,90', './img/celular 5.jpg')">COMPRAR</button>
            </div>

            <div class="cartao-produto">
                <img src="./img/celular 6.png" alt="Celular 6" class="foto-produto">
                <p>Samsung A57 256GB</p>
                <p class="preco">R$ 2.899,90</p>
                <button type="button" class="botao-comprar" onclick="comprarProduto('Samsung A57 256GB', 'R$ 2.899,90', './img/celular 6.png')">COMPRAR</button>
            </div>
        </div>
    </div>
    <script src="resumo.js"></script>
</body>
</html>
